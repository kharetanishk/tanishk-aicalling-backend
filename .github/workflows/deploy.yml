name: Deploy to Production

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            APP_DIR=~/tanishk-aicalling-backend

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://github.com/kharetanishk/tanishk-aicalling-backend.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin master
            git reset --hard origin/master

            npm ci --omit=dev

            mkdir -p logs

            if pm2 describe aicalling-backend > /dev/null 2>&1; then
              pm2 reload ecosystem.config.cjs --update-env
            else
              pm2 start ecosystem.config.cjs --env production
            fi

            pm2 save

      - name: Health check
        run: |
          sleep 5
          curl --fail --silent --max-time 10 https://api.tanishk-khare.me/health || exit 1
